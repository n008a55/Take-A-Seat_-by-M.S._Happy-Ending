<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>take your seat for this ending</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }
        body {
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        .character {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 240px;
            background-image: url('蘿莉黑.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain;
            z-index: 20;
            pointer-events: auto;
            image-rendering: auto;
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.45));
            touch-action: none;
        }
        .entry-button {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            padding: 16px 36px;
            background: rgba(0, 0, 0, 0.92);
            color: #ffbf72;
            border: 1px solid rgb(255, 188, 87);
            border-radius: 999px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            z-index: 10;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .entry-button:hover {
            background: #111;
            transform: translateX(-50%) translateY(-1px);
        }
    </style>
</head>
<body>

    <video id="lockVideo" autoplay loop muted playsinline>
        <source src="willyoubehereforme.mp4" type="video/mp4">
    </video>

    <div id="character" class="character" aria-label="character"></div>

    <a href="https://www.youtube.com/@makuroon99?sub_confirmation=1" class="entry-button" target="_blank" rel="noopener noreferrer">入場</a>

    <script>
        const video = document.getElementById('lockVideo');
        const character = document.getElementById('character');

        const state = {
            x: 120,
            y: 40,
            vx: 1.4,
            vy: 0,
            width: 240,
            height: 240,
            gravity: 0.45,
            dragging: false,
            dragOffsetX: 0,
            dragOffsetY: 0
        };

        function clampCharacter() {
            state.x = Math.max(0, Math.min(window.innerWidth - state.width, state.x));
            state.y = Math.max(0, Math.min(window.innerHeight - state.height, state.y));
        }

        function render() {
            character.style.transform = `translate(${state.x}px, ${state.y}px)`;
        }

        function animate() {
            if (!state.dragging) {
                state.vy += state.gravity;
                state.x += state.vx;
                state.y += state.vy;

                if (state.x <= 0) {
                    state.x = 0;
                    state.vx = Math.abs(state.vx) * 0.8;
                }

                if (state.x + state.width >= window.innerWidth) {
                    state.x = window.innerWidth - state.width;
                    state.vx = -Math.abs(state.vx) * 0.8;
                }

                if (state.y <= 0) {
                    state.y = 0;
                    state.vy = Math.abs(state.vy) * 0.6;
                }

                if (state.y + state.height >= window.innerHeight) {
                    state.y = window.innerHeight - state.height;
                    state.vy = -Math.abs(state.vy) * 0.7;
                    state.vx *= 0.985;
                    if (Math.abs(state.vy) < 0.2) {
                        state.vy = 0;
                    }
                }

                clampCharacter();
            }

            render();
            requestAnimationFrame(animate);
        }

        character.addEventListener('pointerdown', (event) => {
            state.dragging = true;
            const rect = character.getBoundingClientRect();
            state.dragOffsetX = event.clientX - rect.left;
            state.dragOffsetY = event.clientY - rect.top;
            state.vx = 0;
            state.vy = 0;
            character.setPointerCapture(event.pointerId);
        });

        character.addEventListener('pointermove', (event) => {
            if (!state.dragging) return;

            const nextX = event.clientX - state.dragOffsetX;
            const nextY = event.clientY - state.dragOffsetY;

            state.x = Math.max(0, Math.min(window.innerWidth - state.width, nextX));
            state.y = Math.max(0, Math.min(window.innerHeight - state.height, nextY));
            state.vx = event.movementX * 0.5;
            state.vy = event.movementY * 0.5;
            render();
        });

        character.addEventListener('pointerup', (event) => {
            state.dragging = false;
            character.releasePointerCapture(event.pointerId);
        });

        character.addEventListener('pointerleave', () => {
            state.dragging = false;
        });

        video.addEventListener('pause', () => {
            video.play();
        });

        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', (event) => {
            const blockedKeys = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Escape', 'Tab'];
            if (blockedKeys.includes(event.code)) {
                event.preventDefault();
            }
        });

        window.addEventListener('resize', () => {
            clampCharacter();
            render();
        });

        render();
        requestAnimationFrame(animate);
    </script>

</body>
</html>
