<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>take your seat for this ending</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            cursor: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        .entry-button {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 180px;
            padding: 16px 36px;
            background: rgba(0, 0, 0, 0.92);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            z-index: 10;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .entry-button:hover {
            background: #111;
            transform: translateX(-50%) translateY(-1px);
        }
    </style>
</head>
<body>

    <video id="lockVideo" autoplay loop muted playsinline>
        <source src="willyoubehereforme.mp4" type="video/mp4">
    </video>

    <a href="https://www.youtube.com/@makuroon99?sub_confirmation=1" class="entry-button" target="_blank" rel="noopener noreferrer">入場</a>

    <script>
        const video = document.getElementById('lockVideo');


        video.addEventListener('pause', () => {
            video.play();
        });

        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', (event) => {
            const blockedKeys = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Escape', 'Tab'];
            if (blockedKeys.includes(event.code)) {
                event.preventDefault();
            }
        });
    </script>

</body>
</html>
